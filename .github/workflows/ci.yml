name: ClientFlow checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build and test
        run: ./scripts/build
      - name: Start isolated demo
        run: |
          cd backend
          java -jar target/clientflow-1.0.0.jar > ../server.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:8080/actuator/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:8080/actuator/health
      - name: Browser tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ../.tools/browsers
          DEMO_URL: http://127.0.0.1:8080
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            frontend/playwright-report
            backend/target/surefire-reports
            docs/screenshots
            server.log
      - uses: actions/upload-artifact@v4
        with:
          name: clientflow-demo
          path: backend/target/clientflow-1.0.0.jar
